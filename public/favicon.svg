<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded Purple background matching #915eff -->
  <rect width="100" height="100" rx="24" fill="#915eff"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="50" cy="52" r="36" fill="#ffffff" opacity="0.15"/>
  
  <!-- Neck -->
  <path d="M43 65 L43 76 L57 76 L57 65 Z" fill="#ffd19a"/>
  
  <!-- Collar / Shirt -->
  <path d="M30 84 C30 74 38 72 50 72 C62 72 70 74 70 84 Z" fill="#3b82f6"/>
  
  <!-- Ears -->
  <circle cx="28" cy="48" r="6" fill="#ffd19a"/>
  <circle cx="72" cy="48" r="6" fill="#ffd19a"/>
  
  <!-- Face -->
  <ellipse cx="50" cy="48" rx="21" ry="23" fill="#ffd19a"/>
  
  <!-- Hair (Sleek dark modern hair style) -->
  <path d="M26 44 C25 24 35 18 50 18 C65 18 75 24 74 44 C70 32 60 26 50 26 C40 26 30 32 26 44 Z" fill="#1e1b4b"/>
  <path d="M28 38 C32 28 42 26 52 30 C62 26 68 28 72 35 C64 30 55 31 48 35 C40 33 33 34 28 38 Z" fill="#312e81"/>
  <path d="M30 38 C35 30 45 28 55 33 C46 32 38 34 30 38 Z" fill="#4338ca"/>

  <!-- Eyebrows -->
  <path d="M38 41 Q43 38 47 41" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M53 41 Q57 38 62 41" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Eyes (No glasses, clean open eyes) -->
  <circle cx="42.5" cy="47.5" r="3.5" fill="#0f172a"/>
  <circle cx="57.5" cy="47.5" r="3.5" fill="#0f172a"/>
  <circle cx="43.5" cy="46.5" r="1.2" fill="#ffffff"/>
  <circle cx="58.5" cy="46.5" r="1.2" fill="#ffffff"/>
  
  <!-- Nose -->
  <path d="M50 49 Q48 53 51 53" stroke="#eab308" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M44 57 Q50 62 56 57" stroke="#991b1b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
